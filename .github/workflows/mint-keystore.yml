name: mint-keystore

# One-shot helper: generates the PINNED release keystore and publishes it
# base64-encoded as an artifact, so it can be stored once as the
# DIRTYFRAG_KEYSTORE_B64 secret and reused by every later build.
#
# Why this exists: build-opd2515.yml used to keytool a new keystore per run, so
# every artifact had a different signature. Android refuses to replace an
# installed app whose signature differs, so each install became
# uninstall+reinstall, and the OPPO installer demands a manual tap for that
# (it filters injected input). That is what made device testing need a human.
#
# Run this at most once. After the secret is set, delete this workflow.

on:
  workflow_dispatch:

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate the pinned keystore
        run: |
          keytool -genkeypair -v \
            -keystore dirtyfrag.jks \
            -storepass dirtyfrag -keypass dirtyfrag \
            -alias dirtyfrag \
            -dname 'CN=DirtyFrag' \
            -keyalg RSA -keysize 2048 -validity 10950 -noprompt
          echo "--- certificate fingerprint (record this) ---"
          keytool -list -keystore dirtyfrag.jks -storepass dirtyfrag

      - name: Encode and checksum
        run: |
          base64 -w0 dirtyfrag.jks > keystore.b64
          echo "bytes(jks)=$(stat -c%s dirtyfrag.jks) bytes(b64)=$(stat -c%s keystore.b64)"
          sha256sum dirtyfrag.jks keystore.b64

      - uses: actions/upload-artifact@v4
        with:
          name: pinned-keystore
          path: |
            keystore.b64
            dirtyfrag.jks
